<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEC · Level 1</title>
<style>
  :root{
    --bg:#FFF7F0; --card:#FFFFFF; --ink:#1F2A44; --muted:#6B7280; --line:#EEF0F4;
    --orange:#F5761A; --orange-deep:#D9560B; --orange-soft:#FFE7D1;
    --red:#E5484D; --blue:#2F80ED; --yellow:#F7B500; --green:#2BA56B; --purple:#8E6CEF;
    --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .hidden{display:none!important}
  :root[data-theme="dark"]{--bg:#1B1F2E;--card:#252B3D;--ink:#F4F6FB;--muted:#A7B0C4;--line:#333950;--orange-soft:#3A2A1F}
  #theme{position:fixed;top:14px;right:14px;z-index:50;width:52px;height:52px;border-radius:50%;background:var(--card);font-size:24px;box-shadow:0 4px 0 rgba(31,42,68,.12)}
  #theme.inhero{position:static;flex:none;margin-left:auto;background:rgba(255,255,255,.22);box-shadow:none}

  /* ---------- Onboarding ---------- */
  #onboard{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  .anis-big{width:200px;height:200px;border-radius:50%;overflow:hidden;background:#fff3e6;animation:bob 3s ease-in-out infinite}
  .anis-big img,.anis-img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .say{background:#fff;border-radius:28px;padding:18px 26px;max-width:560px;font-size:clamp(22px,3vw,30px);line-height:1.35;min-height:72px;box-shadow:0 8px 0 rgba(31,42,68,.06)}
  .step{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
  .big-btn{background:var(--orange);color:#fff;font-size:22px;font-weight:700;border-radius:999px;padding:14px 40px;min-height:60px;box-shadow:0 6px 0 var(--orange-deep)}
  .big-btn:disabled{opacity:.4;cursor:default}
  .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-deep)}
  .name-in{font:inherit;font-size:28px;text-align:center;padding:12px 20px;border-radius:20px;border:3px solid var(--yellow);width:min(380px,90vw);min-height:60px;outline:none;background:#fff}
  .ages{display:flex;gap:16px}
  .age{width:110px;height:110px;border-radius:30px;background:#fff;font-size:44px;font-weight:700;color:var(--orange);box-shadow:0 8px 0 rgba(31,42,68,.06)}
  .age.on{background:var(--orange);color:#fff;box-shadow:0 8px 0 var(--orange-deep)}
  .likes{display:grid;grid-template-columns:repeat(4,minmax(110px,150px));gap:12px;max-width:680px}
  .like{background:#fff;border-radius:22px;padding:14px 8px;font-size:40px;box-shadow:0 6px 0 rgba(31,42,68,.06);display:flex;flex-direction:column;align-items:center;gap:4px}
  .like small{font-size:15px;color:var(--muted);font-weight:700}
  .like.on{background:var(--orange-soft);outline:3px solid var(--orange)}

  /* ---------- Dashboard (fits one screen, no scrolling) ---------- */
  #dash{height:100vh;padding:18px;display:grid;grid-template-columns:1fr 300px;gap:16px;overflow:hidden}
  .main{display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(0,1.25fr);gap:14px;min-height:0}
  .side{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:14px;min-height:0}
  .panel{background:var(--card);border-radius:var(--r);padding:16px;min-height:0;overflow:hidden}
  .hero{display:flex;align-items:center;gap:18px;background:var(--orange);color:#fff;border-radius:var(--r);padding:16px 22px}
  .hero .anis-img{width:86px;height:86px;border-radius:50%;flex:none;background:#fff3e6;cursor:pointer}
  .hero h1{font-size:28px;line-height:1.1}
  .hero p{font-size:17px;opacity:.95;margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{border-radius:var(--r);padding:14px 18px;background:var(--card)}
  .stat b{display:block;font-size:34px;line-height:1}
  .stat span{color:var(--muted);font-size:15px}
  .stat.o b{color:var(--orange)} .stat.bl b{color:var(--blue)} .stat.y b{color:var(--yellow)}
  .mid{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
  .title{font-size:18px;margin-bottom:10px;font-weight:700}
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut{position:relative;width:140px;height:140px;flex:none}
  .donut svg{width:100%;height:100%;transform:rotate(-90deg)}
  .donut .mid-t{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700}
  .legend div{display:flex;align-items:center;gap:8px;font-size:16px;margin:6px 0}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border-radius:999px;padding:10px 16px;font-size:17px;font-weight:700;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .chip .i{margin-right:6px}
  .classes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-height:0;flex:1}
  .class{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:0}
  .class .pic{flex:1;min-height:0;border-radius:16px;overflow:hidden;background:var(--bg)}
  .class .pic img,.class .pic svg{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
  .class b{font-size:17px}
  .class small{color:var(--muted);font-size:14px}
  .tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:#fff;align-self:flex-start}
  .profile{display:flex;align-items:center;gap:12px}
  .profile .av{width:52px;height:52px;border-radius:50%;background:var(--orange-soft);display:grid;place-items:center;font-size:26px;flex:none}
  .profile b{font-size:19px;display:block}
  .profile small{color:var(--muted);font-size:15px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
  .week div{text-align:center;padding:9px 0;border-radius:12px;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted)}
  .week div.learn{color:var(--ink)}
  .week div.game{background:var(--yellow);color:var(--ink)}
  .week div.explore{background:var(--green);color:#fff}
  .week div.today{outline:3px solid var(--orange)}
  .main-teacher{display:flex;flex-direction:column;gap:8px;min-height:0;cursor:pointer}
  .main-teacher .pic{flex:1;min-height:0;border-radius:18px;overflow:hidden;background:var(--bg)}
  .main-teacher .pic img,.main-teacher .pic svg{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
  .main-teacher b{font-size:20px}
  .main-teacher small{color:var(--muted);font-size:15px}
  .empty{color:var(--muted);font-size:15px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ ONBOARDING ============ -->
<section id="onboard">
  <div class="anis-big"><img src="assets/anis.jpg" alt="Anis"></div>
  <div class="say" id="say"></div>

  <div class="step hidden" id="st-name">
    <input class="name-in" id="name" maxlength="20" placeholder="Name" autocomplete="off">
    <button class="big-btn" id="to-age" disabled>Next</button>
  </div>

  <div class="step hidden" id="st-age">
    <div class="ages">
      <button class="age" data-age="2">2</button>
      <button class="age" data-age="3">3</button>
      <button class="age" data-age="4">4</button>
    </div>
    <button class="big-btn" id="to-likes" disabled>Next</button>
  </div>

  <div class="step hidden" id="st-likes">
    <div class="likes" id="likes"></div>
    <button class="big-btn" id="to-dash" disabled>Next</button>
  </div>
</section>

<!-- ============ DASHBOARD ============ -->
<section id="dash" class="hidden">
  <div class="main">
    <div class="hero" id="hero">
      <img class="anis-img" id="hero-anis" src="assets/anis.jpg" alt="Anis">
      <div>
        <h1 id="hello">Hello!</h1>
        <p>Level 1</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat o"><b id="s-age">–</b><span>Age</span></div>
      <div class="stat bl"><b>5</b><span>Learning days</span></div>
      <div class="stat y"><b id="s-worlds">0</b><span>My worlds</span></div>
    </div>

    <div class="mid">
      <div class="panel">
        <div class="title">Your week</div>
        <div class="donut-wrap">
          <div class="donut" id="donut"></div>
          <div class="legend">
            <div><i style="background:var(--orange)"></i>Learning, Mon–Fri</div>
            <div><i style="background:var(--yellow)"></i>Game Day, Sat</div>
            <div><i style="background:var(--green)"></i>Explore Day, Sun</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="title">My worlds</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column">
      <div class="title">Classes</div>
      <div class="classes" id="classes"></div>
    </div>
  </div>

  <aside class="side">
    <div class="panel">
      <div class="profile">
        <div class="av">🧒</div>
        <div><b id="pname">Friend</b><small>Level 1</small></div>
      </div>
      <div class="week" id="week"></div>
    </div>
    <div class="panel">
      <div class="title">Today</div>
      <div class="empty" id="daytext"></div>
    </div>
    <div class="panel main-teacher" id="main-teacher" style="display:flex;flex-direction:column">
      <div class="title">Your main teacher</div>
      <div class="pic" id="mt-pic"></div>
      <b id="mt-name">Mr. Abdul Hadi</b>
      <small>Teaches you everything</small>
    </div>
  </aside>
</section>

<button id="theme" aria-label="Switch light and dark">🌙</button>
<div class="toast" id="toast"></div>

<script>
/* ---------- state (this browser only) ---------- */
const KEY="tec-l1";
let state={name:"",age:null,likes:[],done:false};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);
const show=(el,on)=>el.classList.toggle("hidden",!on);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}

/* ---------- voice + typed text (browser voice for now) ---------- */
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=.9;u.pitch=1.15;u.lang="en-GB";
  speechSynthesis.speak(u);
}
let typing=0;
function say(text,after){
  const el=$("#say");const my=++typing;
  el.textContent="";speak(text);
  let i=0;const t=setInterval(()=>{
    if(my!==typing){clearInterval(t);return}
    el.textContent=text.slice(0,++i);
    if(i>=text.length){clearInterval(t);after&&setTimeout(after,250)}
  },30);
}

/* ---------- data ---------- */
const TEACHERS={
  arabic:  {name:"Mr. Umar",        subject:"Arabic",                img:"assets/teachers/arabic.jpg",   color:"var(--red)"},
  english: {name:"Mr. David",       subject:"English",               img:"assets/teachers/english.jpg",  color:"var(--blue)"},
  maths:   {name:"Mr. Muhammad",    subject:"Mathematics",           img:"assets/teachers/maths.png",    color:"var(--orange)"},
  tech:    {name:"Mr. Jensen",      subject:"Computer & Technology", img:null,                           color:"var(--purple)"},
  char:    {name:"Mr. Abdul Hadi",  subject:"Tarbiyah & Character",  img:"assets/teachers/tarbiyah.jpg", color:"var(--green)"}
};
const introOf=t=>`This is ${t.name}. He teaches ${t.subject}.`;
const LIKES=[
  {id:"animals",ico:"🦁", name:"Animals"},
  {id:"space",  ico:"🪐", name:"Space"},
  {id:"cars",   ico:"🏎️", name:"Cars"},
  {id:"art",    ico:"🎨", name:"Art"}
];
const LIKE=Object.fromEntries(LIKES.map(l=>[l.id,l]));
const likeLine=id=>`You like ${LIKE[id].name.toLowerCase()}! Nice choice.`;

/* simple original teacher drawing, used where there is no photo */
function drawTeacher(c){
  return `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" style="background:#F3EEFF">
    <path d="M30 200 Q34 128 100 122 Q166 128 170 200Z" fill="${c}"/>
    <ellipse cx="100" cy="88" rx="44" ry="48" fill="#F2C29B"/>
    <path d="M56 90 Q58 40 100 38 Q142 40 144 90 Q130 64 100 62 Q70 64 56 90Z" fill="#1F1F2E"/>
    <circle cx="84" cy="92" r="5" fill="#1F2A44"/><circle cx="116" cy="92" r="5" fill="#1F2A44"/>
    <path d="M88 110 Q100 120 112 110" stroke="#1F2A44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const picOf=t=>t.img?`<img src="${t.img}" alt="${t.name}">`:drawTeacher("#8E6CEF");

/* ---------- onboarding ---------- */
function startOnboarding(){
  show($("#onboard"),true);show($("#dash"),false);
  document.body.appendChild($("#theme"));$("#theme").classList.remove("inhero");
  say("Hello! I am Anis. I am your learning friend.",()=>{
    say("What is your name?",()=>show($("#st-name"),true));
  });
}
const nameIn=$("#name");
nameIn.oninput=()=>{$("#to-age").disabled=nameIn.value.trim().length<1};
$("#to-age").onclick=()=>{
  state.name=nameIn.value.trim();save();
  show($("#st-name"),false);
  say(`Nice to meet you, ${state.name}! How old are you?`,()=>show($("#st-age"),true));
};
document.querySelectorAll(".age").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".age").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");state.age=+b.dataset.age;$("#to-likes").disabled=false;
});
$("#to-likes").onclick=()=>{
  save();show($("#st-age"),false);
  say("What do you like? Tap everything you love.",()=>{renderLikes();show($("#st-likes"),true)});
};
function renderLikes(){
  $("#likes").innerHTML=LIKES.map(l=>`
    <button class="like ${state.likes.includes(l.id)?"on":""}" data-id="${l.id}">${l.ico}<small>${l.name}</small></button>`).join("");
  document.querySelectorAll(".like").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(state.likes.includes(id)){state.likes=state.likes.filter(x=>x!==id)}
    else{state.likes.push(id);say(likeLine(id))}
    save();
    b.classList.toggle("on",state.likes.includes(id));
    $("#to-dash").disabled=state.likes.length<1;
  });
  $("#to-dash").disabled=state.likes.length<1;
}
$("#to-dash").onclick=()=>{
  state.done=true;save();
  say(`Great, ${state.name}! Let's go to your TEC.`,()=>setTimeout(showDashboard,900));
};

/* ---------- dashboard ---------- */
function showDashboard(){
  show($("#onboard"),false);show($("#dash"),true);
  $("#hero").appendChild($("#theme"));$("#theme").classList.add("inhero");
  const name=state.name||"Friend";
  $("#hello").textContent=`Hello, ${name}!`;
  $("#pname").textContent=name;
  $("#s-age").textContent=state.age??"–";
  $("#s-worlds").textContent=state.likes.length;

  const colors=["var(--orange)","var(--blue)","var(--green)"];
  $("#chips").innerHTML=state.likes.length
    ? state.likes.map((id,i)=>`<button class="chip" style="background:${colors[i%3]}" data-id="${id}"><span class="i">${LIKE[id].ico}</span>${LIKE[id].name}</button>`).join("")
    : `<span class="empty">No worlds chosen yet.</span>`;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>say(likeLine(b.dataset.id)));

  $("#classes").innerHTML=["arabic","english","maths","tech"].map(k=>{const t=TEACHERS[k];return `
    <div class="class" data-k="${k}">
      <div class="pic">${picOf(t)}</div>
      <span class="tag" style="background:${t.color}">Level 1</span>
      <b>${t.name}</b><small>${t.subject}</small>
    </div>`}).join("");
  document.querySelectorAll(".class").forEach(c=>c.onclick=()=>say(introOf(TEACHERS[c.dataset.k])));

  $("#mt-pic").innerHTML=picOf(TEACHERS.char);
  $("#mt-name").textContent=TEACHERS.char.name;
  $("#main-teacher").onclick=()=>say(introOf(TEACHERS.char)+" He will teach you every day.");

  // Monday-first week; today is highlighted from the device clock
  const today=new Date().getDay();
  $("#week").innerHTML=[1,2,3,4,5,6,0].map((d,i)=>{
    const cls=d===6?"game":d===0?"explore":"learn";
    return `<div class="${cls}${d===today?" today":""}">${"MTWTFSS"[i]}</div>`;
  }).join("");
  $("#daytext").textContent=today===0?"Explore Day":today===6?"Game Day":"Learning Day";

  $("#donut").innerHTML=(()=>{
    const R=58,C=2*Math.PI*R,parts=[{v:5,c:"var(--orange)"},{v:1,c:"var(--yellow)"},{v:1,c:"var(--green)"}];
    let off=0;
    const arcs=parts.map(p=>{const len=C*p.v/7;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${(len-3).toFixed(1)} ${C}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=len;return s}).join("");
    return `<svg viewBox="0 0 140 140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="16"/>${arcs}</svg><div class="mid-t">7</div>`;
  })();

  $("#hero-anis").onclick=()=>say(`Hello${state.name?", "+state.name:""}! I am Anis. Let's learn together.`);

  // Anis says the child's choices clearly
  if(state.likes.length)say(`You like ${state.likes.map(id=>LIKE[id].name.toLowerCase()).join(" and ")}. Let's learn with those!`);
}

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  $("#theme").textContent=t==="dark"?"☀️":"🌙";
  try{localStorage.setItem("tec-theme",t)}catch(e){}
}
$("#theme").onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
applyTheme(localStorage.getItem("tec-theme")||"light");

/* ---------- start ---------- */
if(state.done&&state.name)showDashboard();
else startOnboarding();
</script>
</body>
</html>
